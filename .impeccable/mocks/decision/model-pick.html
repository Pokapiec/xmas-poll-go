<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --snow:#f7f6f2; --red:#9e1b32; --pine:#1e4d3a; --gold:#d9a441; --ink:#1c1c1c; --muted:#666; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: var(--snow); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  header { background: var(--pine); color: #fff; padding: 16px; }
  header small { color: var(--gold); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  header h1 { font: 800 24px/1.15 'Bricolage Grotesque'; }
  main { padding: 20px 16px; display: grid; gap: 16px; }
  h2 { font: 700 22px 'Bricolage Grotesque'; }
  .door { background: var(--red); color: #fff; border-radius: 14px; padding: 20px; display: grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: center; border: 3px dashed rgba(255,255,255,.35); outline: 3px solid var(--red); }
  .num { width: 72px; height: 72px; border-radius: 10px; background: var(--gold); color: var(--red); font: 800 40px 'Bricolage Grotesque'; display: grid; place-items: center; }
  .door p { font-size: 14px; opacity: .9; }
  .door b { font: 700 18px 'Bricolage Grotesque'; display:block; }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 0 #e4e2dc; }
  ul { list-style: none; padding: 0; display: grid; gap: 8px; margin-top: 12px; }
  li { padding: 12px; border: 1px solid #e4e2dc; border-radius: 10px; display:flex; justify-content: space-between; }
  .add { margin-top: 12px; display:grid; gap: 8px; }
  .field { border: 1.5px solid #d8d6cf; border-radius: 10px; padding: 12px; color: #999; height: 72px; }
  .btn { background: var(--red); color: #fff; font-weight: 700; text-align: center; border-radius: 10px; padding: 14px; }
</style>
</head>
<body>
  <header><small>Wigilia u Kowalskich</small><h1>Cześć, Ania!</h1></header>
  <main>
    <div class="door">
      <div class="num">24</div>
      <div><b>Twoje drzwiczki są zamknięte</b><p>Dopisz jeszcze 1 prezent, a otworzą się i zobaczysz, komu kupujesz.</p></div>
    </div>
    <section class="card">
      <h2>Twoja lista</h2>
      <ul>
        <li>Termos na herbatę <span>✕</span></li>
        <li>Puzzle 1000 elementów, góry <span>✕</span></li>
      </ul>
      <div class="add"><div class="field">Czego jeszcze chcesz?</div><div class="btn">Dodaj prezent</div></div>
    </section>
  </main>
</body>
</html>
