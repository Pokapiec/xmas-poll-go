<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; background: #f4f4f5; color: #18181b; font: 16px/1.5 system-ui, sans-serif; }
  header { background: #fff; border-bottom: 1px solid #e4e4e7; padding: 14px 16px; display:flex; justify-content: space-between; font-weight: 600; }
  main { padding: 20px 16px; display: grid; gap: 16px; }
  h1 { font-size: 24px; font-weight: 700; }
  .muted { color: #71717a; font-size: 14px; }
  .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .lock { display:flex; gap: 12px; align-items:center; }
  .bar { height: 8px; border-radius: 4px; background: #e4e4e7; margin-top: 8px; } .bar i { display:block; height: 100%; width: 66%; background: #dc2626; border-radius: 4px; }
  ul { list-style: none; padding: 0; } li { padding: 12px 0; border-bottom: 1px solid #f4f4f5; display:flex; justify-content: space-between; }
  .field { border: 1px solid #d4d4d8; border-radius: 8px; padding: 12px; color: #a1a1aa; margin-top: 12px; }
  .btn { background: #dc2626; color:#fff; text-align:center; font-weight: 600; border-radius: 8px; padding: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <header><span>Xmas Gift Poll</span><span>PL ▾</span></header>
  <main>
    <div><h1>Cześć, Ania!</h1><p class="muted">Wigilia u Kowalskich</p></div>
    <div class="card"><h2>Twoje losowanie</h2><p class="muted">Dodaj jeszcze 1 prezent, aby zobaczyć, komu kupujesz.</p><div class="bar"><i></i></div></div>
    <div class="card">
      <h2>Twoja lista</h2>
      <ul><li>Termos na herbatę <span>🗑</span></li><li>Puzzle 1000 elementów, góry <span>🗑</span></li></ul>
      <div class="field">Czego jeszcze chcesz?</div>
      <div class="btn">Dodaj prezent</div>
    </div>
  </main>
</body>
</html>
