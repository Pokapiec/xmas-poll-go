# fly.toml app configuration file generated for xmas-poll-go on 2026-11-21T09:20:01Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'xmas-poll-go'
primary_region = 'fra'
kill_signal = 'SIGTERM'

[build]
[env]
  PORT = '8080'

[[mounts]]
  source = 'db'
  destination = '/app/db'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
