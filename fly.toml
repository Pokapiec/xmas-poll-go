# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'xmas-gift-poll-go'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]

[env]
  PORT = '8080'
  # The database goes to /app/db/xmas_gift_poll.db on the volume mounted below.

[[mounts]]
  source = 'db'
  destination = '/app/db'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
